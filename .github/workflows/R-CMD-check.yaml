# Based on r-lib/actions examples: https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [dev, overhaul-0.5]
  pull_request:
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }}${{ matrix.config.seurat && format(', {0}', matrix.config.seurat) || '' }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          # oldest supported Seurat major version (hdWGCNA supports Seurat 5 and 6)
          - {os: ubuntu-latest,  r: 'release', seurat: 'Seurat@5.5.1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # Replace the latest Seurat with the pinned version for the Seurat 5 job. Installed
      # separately with hard dependencies only: Seurat 5.5.1 suggests BPCells, which is
      # not on CRAN and makes the full dependency solve fail.
      - name: Install pinned Seurat
        if: ${{ matrix.config.seurat }}
        run: |
          pak::pkg_install('${{ matrix.config.seurat }}', dependencies = NA, upgrade = FALSE)
          cat('Seurat', as.character(packageVersion('Seurat')), '\n')
        shell: Rscript {0}

      # Vignettes use large external datasets and are not built in CI.
      # They will move to pre-computed pkgdown articles (see notes/10_vignettes.md).
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual", "--no-build-vignettes")'
          args: 'c("--no-manual", "--as-cran", "--ignore-vignettes")'
          error-on: '"error"'
