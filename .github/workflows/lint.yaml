# Based on r-lib/actions examples: https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [dev, overhaul-0.5]
  pull_request:
  workflow_dispatch:

name: lint

permissions: read-all

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::lintr, local::.
          needs: lint

      - name: Lint
        run: lintr::lint_package()
        shell: Rscript {0}
        env:
          # Report-only until the one-time restyle + lint cleanup is done (Phase 1);
          # then set to true so lints fail the build.
          LINTR_ERROR_ON_LINT: false
