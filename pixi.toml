[workspace]
name = "hdWGCNA"
description = "Development environment for the hdWGCNA R package"
channels = ["conda-forge", "bioconda"]
# osx-arm64 omitted for now: bioconda has no r-wgcna build for Apple Silicon
# (see notes/10_vignettes.md, Pixi install section)
platforms = ["osx-64", "linux-64"]

# ---------------------------------------------------------------------------
# Runtime dependencies of hdWGCNA (current state of the code; will shrink
# during the dependency restructuring, see notes/02_cleanup.md)
# ---------------------------------------------------------------------------
[dependencies]
r-base = "4.5.*"

# core
r-seurat = ">=5"
r-seuratobject = ">=5"
r-wgcna = "*"
r-matrix = "*"
r-harmony = "*"
r-igraph = "*"
r-ggraph = "*"
r-tidygraph = "*"
r-ggplot2 = "*"
r-ggrepel = "*"
r-patchwork = "*"
r-dplyr = "*"
r-tidyr = "*"
r-purrr = "*"
r-magrittr = "*"
r-stringr = "*"
r-reshape2 = "*"
r-scales = "*"
r-uwot = "*"
r-proxy = "*"
r-tester = "*"
r-enrichr = "*"
r-fnn = "*"
r-gtools = "*"
r-hmisc = "*"
"r-future.apply" = "*"

# Bioconductor
bioconductor-ucell = "*"
bioconductor-geneoverlap = "*"
bioconductor-genomicranges = "*"
bioconductor-genomeinfodb = "*"
bioconductor-summarizedexperiment = "*"
bioconductor-singlecellexperiment = "*"

# optional / Suggests-type packages used in parts of the code
r-corrplot = "*"
r-ggrastr = "*"
r-qgraph = "*"
r-ggseqlogo = "*"
r-xgboost = "*"
r-netrep = "*"
bioconductor-deseq2 = "*"
bioconductor-limma = "*"
bioconductor-motifmatchr = "*"
bioconductor-ensembldb = "*"
bioconductor-decoupler = "*"

# ---------------------------------------------------------------------------
# Development tooling
# ---------------------------------------------------------------------------
r-devtools = "*"
r-roxygen2 = "*"
r-testthat = ">=3"
r-covr = "*"
r-rcmdcheck = "*"
r-pkgdown = "*"
r-knitr = "*"
r-rmarkdown = "*"
r-vdiffr = "*"
r-lintr = "*"
r-styler = "*"
r-urlchecker = "*"
r-spelling = "*"
r-bench = "*"
r-profmem = "*"
r-profvis = "*"
pandoc = "*"
qpdf = "*"            # needed by R CMD check --as-cran
bioconductor-splatter = "*"   # simulated test / benchmark data (data-raw only)

[tasks]
document = "Rscript -e 'devtools::document()'"
install = "R CMD INSTALL --no-multiarch ."
test = "Rscript -e 'devtools::test()'"
coverage = "Rscript -e 'covr::report(covr::package_coverage())'"
check = "Rscript -e 'rcmdcheck::rcmdcheck(args = c(\"--as-cran\", \"--no-manual\"), error_on = \"never\", check_dir = \"check\")'"
site = "Rscript -e 'pkgdown::build_site()'"
style = "Rscript -e 'source(\"tools/style.R\"); style_hdwgcna()'"
lint = "Rscript -e 'lintr::lint_package()'"
